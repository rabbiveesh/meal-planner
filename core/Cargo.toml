[package]
name = "meal-core"
version = "0.1.0"
edition = "2021"
description = "Planning logic for the family meal planner: rotation, kashrut timing, prep, shopping and rescue meals."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Until change-graph is released on crates.io.
change-graph = { git = "https://github.com/rabbiveesh/change-graph", rev = "e7811b18ac952fbb2aef3198ca5fb545704a2835", features = ["tsify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
tsify = { version = "0.5", features = ["js"] }
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
